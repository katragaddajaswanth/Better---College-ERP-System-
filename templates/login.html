<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Aditya College ERP</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-body">

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="/" class="brand">

            <img
                src="{{ url_for('static', filename='images/aditya-university-logo.png') }}"
                alt="Aditya University"
                class="brand-logo"
            >

            <div class="brand-text">
                <span class="brand-title">ADITYA</span>
                <span class="brand-subtitle">College ERP</span>
            </div>

        </a>


        <nav class="nav-menu">

            <a href="/">Home</a>

            <a href="/#notices">Notices</a>

            <a href="/#services">Services</a>

            <a href="/login" class="active">Login</a>

        </nav>


        <a href="/login" class="nav-login">
            ↪&nbsp; Login
        </a>

    </header>


    <!-- ================= LOGIN ================= -->

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">

                <img
                    src="{{ url_for('static', filename='images/aditya-university-logo.png') }}"
                    alt="Aditya University"
                >

            </div>


            <h1>
                Student Login
            </h1>


            <p class="login-subtitle">
                Login to access your college ERP portal
            </p>


            <form id="loginForm">


                <div class="login-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Login&nbsp; →
                </button>


            </form>


            <div id="loginMessage"></div>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Aditya College ERP. All rights reserved.
        </p>

        <p>
            Academic Management Portal
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
