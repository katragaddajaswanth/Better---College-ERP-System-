<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fee Details | Aditya College ERP</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">

    <a href="/" class="brand">
        <img
            src="{{ url_for('static', filename='images/aditya-university-logo.png') }}"
            alt="Aditya University"
            class="brand-logo"
        >
    </a>

    <nav class="nav-menu">
        <a href="/">Home</a>
        <a href="/#notices">Notices</a>
        <a href="/#services">Services</a>
        <a href="/login">Login</a>
    </nav>

    <a href="/login" class="nav-login">
        ↪&nbsp; Login
    </a>

</header>


<main class="section">

    <div class="section-title">

        <h2>Fee Details</h2>

        <div class="divider"></div>

        <p>
            Enter your Student ID to view your fee details.
        </p>

    </div>


    <div class="form-container">

        <form id="feesForm">

            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Example: CSE001"
                    required
                    autocomplete="off"
                >

            </div>

            <button type="submit" class="btn">
                Check Fee Details
            </button>

        </form>

    </div>


    <div id="feesResult"></div>

</main>


<footer class="footer">

    <p>
        © 2026 Aditya College ERP. All rights reserved.
    </p>

    <p>
        Academic Management Portal
    </p>

</footer>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
